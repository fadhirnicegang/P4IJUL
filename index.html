<!DOCTYPE html>
<html lang="id">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<title>Birthday Story Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins', sans-serif;background:linear-gradient(180deg,#ffc1e3,#ff9ad0,#ff6eb5,#ff4fa3);overflow:hidden;color:white;}h1,h2{font-family:'Dancing Script', cursive;}
.story{display:none;height:100vh;width:100vw;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.active{display:flex}
.progress-wrap{position:fixed;top:10px;left:10px;right:10px;height:6px;background:rgba(255,255,255,.25);border-radius:99px}
.progress{height:100%;width:14%;background:#fff;border-radius:99px;transition:.5s}
h1{font-size:clamp(2rem,8vw,4rem)}
p{max-width:700px;margin:18px 0}
.btn{padding:14px 28px;border:none;border-radius:999px;background:#fff;color:#ff4fa3;font-weight:bold;cursor:pointer}
.photo{width:260px;height:260px;object-fit:cover;border-radius:24px;border:4px solid #fff;box-shadow:0 0 30px rgba(255,255,255,.8)}
.cake{font-size:120px;cursor:pointer;transition:.3s}
.cake:hover{transform:scale(1.1)}
.gallery{display:flex;gap:12px;overflow:hidden}
.gallery img{width:110px;height:150px;object-fit:cover;border-radius:16px;border:3px solid #fff}
.gift{position:relative;width:220px;height:220px}
.box{width:220px;height:220px;border-radius:16px;border:6px solid #ffd700;background:repeating-linear-gradient(45deg,#ffd1dc,#ffd1dc 20px,#ffc0cb 20px,#ffc0cb 40px);box-shadow:0 0 20px rgba(255,255,255,.5);}
.cat-face{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-size:90px;pointer-events:none;}
.lid{position:absolute;width:220px;height:50px;background:#8b5cf6;border:6px solid gold;top:-15px;transform-origin:bottom;transition:1s}
.open .lid{transform:rotateX(-120deg)}
.hidden{position:absolute;left:50%;top:50%;transform:translate(-50%,40px) scale(.2);opacity:0;transition:1.2s}
.open .hidden{transform:translate(-50%,-220px) scale(1);opacity:1}
.hidden img{width:180px;height:180px;object-fit:cover;border-radius:20px;border:4px solid #fff}
.heart{position:fixed;animation:float 6s linear forwards}
@keyframes float{from{transform:translateY(100vh)}to{transform:translateY(-120vh);opacity:0}}
.type{border-right:3px solid white;white-space:pre-wrap;max-width:700px}
</style>
</head>
<body>
<audio id="bgMusic" loop>
<source src="lagu.mp4" type="audio/mpeg">
</audio>
<div class="progress-wrap"><div class="progress" id="bar"></div></div>
<div class="story active"><h1>🎂 HAPPY BIRTHDAY</h1><h2>PAIJUL</h2><br><button class="btn" onclick="next()">💀</button></div>
<div class="story"><h1>🗿</h1><p>EA amanla bang ultah</p><button class="btn" onclick="next()">HEHE</button></div>
<div class="story"><div class="cake" onclick="cake()">🎂</div><p>Klik Kue +1 Pahala!</p><button class="btn" onclick="next()">Alhamdulillah Berpahala</button></div>
<div class="story"><h2>📸 TOP 3 ORANG NUBBBBB</h2><br><div class="gallery">
<img src="foto1.jpg"><img src="foto2.jpg"><img src="foto3.jpg">
</div><p>3 TERSANGKA TERJERAT KASUS MENGKONSUMSI PIL NOOB :O</p><button class="btn" onclick="next()">YAHAHA</button></div>
<div class="story"><h2>💌 TA KATA</h2><p class="type" id="typing"></p><button class="btn" onclick="next()">Cakeppp</button></div>
<div class="story">
<div class="gift" id="gift">
<div class="lid"></div>
<div class="box">
<div class="cat-face">🐱</div>
</div>
<div class="hidden">
<img src="foto hadiah.jpg">
<p style="margin-top:10px;">
YAHAHAHA HAYYYUUUUU :P
</p>
</div>
</div><br>
<button class="btn" onclick="openGift()">🎁 Buka Hadiah</button>
</div>
<div class="story"><h1>😎 HBD NGAB 💀🎉</h1><p>Semoga sehat selalu, panjang umur, dan semua impianmu tercapai.</p></div>
<script>
  const music = document.getElementById("bgMusic");
music.volume = 1; // volume 100%
let i=0;
const pages=document.querySelectorAll('.story');
function upd(){document.getElementById('bar').style.width=((i+1)/pages.length*100)+'%'}
function next(){

 if(i===0){
   music.play().catch(()=>{});
 }

 pages[i].classList.remove('active');
 i=Math.min(i+1,pages.length-1);
 pages[i].classList.add('active');
 upd();

 if(i===4) typeText();
}
upd();

function cake(){
for(let i=0;i<80;i++){let h=document.createElement('div');h.innerHTML=':v';h.style.position='fixed';h.style.left=Math.random()*100+'vw';h.style.top='-50px';h.style.fontSize='30px';h.style.zIndex='9999';document.body.appendChild(h);h.animate([{transform:'translateY(0px)'},{transform:'translateY(110vh) rotate(360deg)'}],{duration:4000,easing:'linear'});setTimeout(()=>h.remove(),4000);
}
}

function openGift(){
 document.getElementById('gift').classList.add('open');
 confetti(150);
 setTimeout(next,2500);
}

function confetti(n){
 for(let i=0;i<n;i++){
  let d=document.createElement('div');
  d.style.position='fixed';
  d.style.left=Math.random()*100+'vw';
  d.style.top='-10px';
  d.style.width='10px';
  d.style.height='10px';
  d.style.background=`hsl(${Math.random()*360},100%,50%)`;
  d.style.transition='transform 4s linear';
  document.body.appendChild(d);
  setTimeout(()=>d.style.transform='translateY(110vh) rotate(720deg)',10);
 }
}

const msg="HBD EA 🎉 Semoga sehat selalu, bahagia selalu, dan DanYapp :v";
function typeText(){
 let el=document.getElementById('typing');
 let n=0;
 let t=setInterval(()=>{
   el.textContent=msg.slice(0,n++);
   if(n>msg.length) clearInterval(t);
 },40);
}

setInterval(()=>{
 let h=document.createElement('div');
 h.className='heart';const emoji=[':v','🗿','😎','🔥','💀','🐱'];h.innerHTML=emoji[Math.floor(Math.random()*emoji.length)];
 h.style.left=Math.random()*100+'vw';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},500);
</script>
</body>
</html>
